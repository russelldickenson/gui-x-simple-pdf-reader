<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Simple PDF Viewer</title>
  </head>
  <body>
    <div id="app">
      <header id="toolbar" data-tauri-drag-region>
        <div class="cluster">
          <button id="btn-open" class="icon-btn" title="Open (⌘O)" aria-label="Open PDF">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 14l1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.93a2 2 0 0 1 1.66.9l2.14 3.2A2 2 0 0 0 13.4 8H18a2 2 0 0 1 2 2v2" />
            </svg>
          </button>
          <button id="btn-toc" class="icon-btn" title="Contents (⌘⇧B)" aria-label="Toggle contents" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 6h12M9 12h12M9 18h12" />
              <circle cx="4.5" cy="6" r="1" />
              <circle cx="4.5" cy="12" r="1" />
              <circle cx="4.5" cy="18" r="1" />
            </svg>
          </button>
          <button id="btn-find" class="icon-btn" title="Find (⌘F)" aria-label="Find in document" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10.5" cy="10.5" r="6.5" />
              <path d="M15.5 15.5L21 21" />
            </svg>
          </button>
        </div>

        <div class="drag-region" data-tauri-drag-region></div>

        <div class="cluster" id="zoom-controls">
          <button id="btn-zoom-out" class="text-btn" title="Zoom out (⌘−)" aria-label="Zoom out" disabled>−</button>
          <button id="btn-zoom-reset" class="zoom-value" title="Actual size (⌘0)" disabled>
            <span id="zoom-label">100%</span>
          </button>
          <button id="btn-zoom-in" class="text-btn" title="Zoom in (⌘+)" aria-label="Zoom in" disabled>+</button>
        </div>

        <div class="cluster page-control">
          <input id="page-input" type="text" inputmode="numeric" aria-label="Page number" value="1" disabled />
          <span class="page-total">/ <span id="page-total">0</span></span>
        </div>

        <button id="btn-print" class="icon-btn" title="Print (⌘P)" aria-label="Print" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 9V3h10v6" />
            <path d="M7 18H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2" />
            <path d="M7 14h10v7H7z" />
          </svg>
        </button>
      </header>

      <div id="main">
        <aside id="sidebar" hidden aria-label="Contents">
          <div class="sidebar-title">Contents</div>
          <nav id="outline"></nav>
        </aside>

        <div id="viewer-wrap">
          <div id="viewer-container"></div>
        </div>

        <div id="empty">
          <svg class="empty-art" viewBox="0 0 48 48" aria-hidden="true">
            <path d="M12 5h16l8 8v30H12z" />
            <path d="M28 5v8h8" />
          </svg>
          <p class="empty-title">No document open</p>
          <button id="btn-empty-open" class="primary-btn">Open a PDF</button>
          <p class="empty-hint">or drop a file anywhere in this window</p>
        </div>

        <form id="findbar" hidden>
          <input id="find-input" type="text" placeholder="Find in document" autocomplete="off" spellcheck="false" aria-label="Find text" />
          <span id="find-count" class="find-count" aria-live="polite"></span>
          <button type="button" id="btn-find-prev" class="icon-btn small" title="Previous match (⇧↩)" aria-label="Previous match">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" /></svg>
          </button>
          <button type="button" id="btn-find-next" class="icon-btn small" title="Next match (↩)" aria-label="Next match">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
          </button>
          <span class="find-sep"></span>
          <button type="button" id="btn-find-close" class="icon-btn small" title="Close (esc)" aria-label="Close find bar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </form>

        <div id="drop-overlay" hidden><span>Drop the PDF to open it</span></div>
        <div id="toast" hidden aria-live="polite"></div>
        <div id="print-container" aria-hidden="true"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
