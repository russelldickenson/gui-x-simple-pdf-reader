[package]
name = "simple-pdf-viewer"
version = "0.1.0"
description = "A minimal PDF reader"
authors = ["you"]
edition = "2021"

[lib]
name = "simple_pdf_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Smaller and faster binaries: one codegen unit, link-time optimisation,
# size-optimised codegen and no debug symbols in the bundle.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
