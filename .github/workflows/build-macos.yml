name: Build macOS DMG

# Builds an unsigned, universal (Intel + Apple Silicon) .dmg for Simple PDF Viewer.
# Signing/notarization is intentionally out of scope (see README.md), so the
# downloaded DMG will trigger Gatekeeper until it is signed and notarized.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build universal macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both slices are needed for Tauri's universal-apple-darwin build.
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # DMG creation is racy on recent macOS releases (see build.sh): the
      # bundler sometimes waits for a .DS_Store that never appears. Retry once;
      # the Rust side is cached by then so the second attempt is cheap.
      - name: Build DMG (one retry on failure)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "::group::Tauri build (attempt $attempt)"
            if npm run tauri build -- --target universal-apple-darwin --bundles dmg; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Build attempt $attempt failed." >&2
            if [ "$attempt" -eq 1 ]; then
              echo "Retrying once (Rust artifacts are cached)." >&2
            fi
          done
          exit 1

      - name: Locate the DMG
        id: dmg
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find src-tauri/target -type f -name '*.dmg' -print -quit)
          if [ -z "$dmg" ]; then
            echo "No .dmg found under src-tauri/target" >&2
            exit 1
          fi
          echo "path=$dmg" >> "$GITHUB_OUTPUT"
          echo "Found DMG: $dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Simple-PDF-Viewer-macos-universal
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

  release:
    name: Attach DMG to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: Simple-PDF-Viewer-macos-universal
          path: artifact

      - name: Upload DMG to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifact/*.dmg
